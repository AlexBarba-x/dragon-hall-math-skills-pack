<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dragon Coach — Solo Math Missions</title>
<!-- kid-solo interactive tutor: mission localStorage Check Hint mastery -->
</head>
<body>
<p id="boot" style="font-family:system-ui;text-align:center;margin-top:2rem;color:#334155">Loading Dragon Coach…</p>
<script>
(async function(){
  const b64="PLACEHOLDER";
  try {
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream("deflate-raw");
    const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("boot").textContent="Could not start. Open in Chrome, Edge, Firefox, or Safari.";
    console.error(e);
  }
})();
</script>
<noscript>Enable JavaScript to use Check, Hint, and mission practice with localStorage stars.</noscript>
</body>
</html>
