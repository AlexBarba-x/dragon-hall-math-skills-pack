<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pip’s Math Missions · Dragon Hall</title>
  <meta name="description" content="A kid-solo math tutor: signed mixed numbers, quotients and inequalities, exponent laws, and percent pay.">
  <link rel="icon" href="img/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --forest: #0d3b2e;
  --forest-deep: #08241c;
  --forest-mid: #164a3a;
  --leaf: #1f6b52;
  --gold: #e8c547;
  --gold-deep: #c9a227;
  --gold-soft: #f3de8a;
  --cream: #f7f1e3;
  --paper: #fffaf0;
  --ink: #1c1812;
  --ink-soft: #4a4338;
  --good: #1d6b45;
  --good-bg: #dceee6;
  --warn: #8a4b12;
  --warn-bg: #f6e3d8;
  --almost: #6b4a12;
  --almost-bg: #f3e7c4;
  --shadow: 0 16px 36px rgba(8, 36, 28, 0.16);
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Nunito", "Segoe UI", system-ui, sans-serif;
  --tap: 3.25rem;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--ink);
  background:
    radial-gradient(900px 420px at 8% -8%, rgba(232, 197, 71, 0.2), transparent 50%),
    radial-gradient(700px 360px at 110% 0%, rgba(31, 107, 82, 0.14), transparent 46%),
    var(--cream);
  font-family: var(--sans);
  font-size: 1.15rem;
  line-height: 1.45;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.skip {
  position: absolute;
  left: -999px;
  top: 0;
}
.skip:focus {
  left: 0.8rem;
  top: 0.8rem;
  z-index: 30;
  background: var(--gold);
  color: var(--forest-deep);
  padding: 0.5rem 0.8rem;
  border-radius: 8px;
}

.top {
  background: linear-gradient(160deg, var(--forest-deep), var(--forest) 62%, var(--forest-mid));
  color: var(--cream);
  border-bottom: 5px solid var(--gold);
  padding: 0.65rem 1rem;
  padding-top: max(0.65rem, env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: inherit;
  text-decoration: none;
}
.brand svg { width: 42px; height: 42px; flex: none; }
.brand strong {
  font-family: var(--serif);
  font-size: 1.05rem;
  display: block;
}
.brand small {
  display: block;
  color: var(--gold-soft);
  font-size: 0.78rem;
  font-weight: 700;
}
.top-actions { display: flex; gap: 0.4rem; }
.icon-btn {
  appearance: none;
  min-width: var(--tap);
  min-height: var(--tap);
  border-radius: 16px;
  border: 2px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font: inherit;
  font-weight: 800;
  padding: 0 0.7rem;
  cursor: pointer;
}
.icon-btn:hover, .icon-btn:focus-visible { background: rgba(232, 197, 71, 0.12); }

#stage {
  flex: 1;
  width: min(40rem, 100%);
  margin: 0 auto;
  padding: 1rem 1rem 2rem;
}

.coach {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.75rem;
  align-items: start;
  margin: 0 0 1rem;
}
.coach .face {
  width: 88px;
  height: 88px;
}
.bubble {
  background: var(--paper);
  border: 3px solid var(--forest);
  border-radius: 22px 22px 22px 8px;
  padding: 0.85rem 1rem;
  box-shadow: var(--shadow);
  font-size: 1.2rem;
  font-weight: 800;
}
.bubble p { margin: 0; }

h1, h2 {
  font-family: var(--serif);
  line-height: 1.15;
  color: var(--forest);
  margin: 0 0 0.5rem;
}
h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); }
h2 { font-size: 1.35rem; }
p { margin: 0 0 0.7rem; }
.lede { color: var(--ink-soft); font-size: 1.12rem; }

.mission-list { display: grid; gap: 0.75rem; }
.mission {
  appearance: none;
  width: 100%;
  text-align: left;
  border: 0;
  background: var(--paper);
  border-radius: 22px;
  padding: 1rem 1.1rem;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 3.1rem 1fr auto;
  gap: 0.8rem;
  align-items: center;
  cursor: pointer;
  font: inherit;
  color: inherit;
  min-height: 5.4rem;
  animation: rise 0.45s ease both;
}
.mission:nth-child(2) { animation-delay: 0.06s; }
.mission:nth-child(3) { animation-delay: 0.12s; }
.mission:nth-child(4) { animation-delay: 0.18s; }
.mission:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }
.mission:hover { transform: translateY(-2px); }
.mission.locked { opacity: 0.72; }
.mission .num {
  width: 3.1rem;
  height: 3.1rem;
  border-radius: 50%;
  background: var(--forest);
  color: var(--gold);
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
}
.mission.locked .num { background: #6d7a74; color: #e6e0d2; }
.mission .copy strong { display: block; font-family: var(--serif); font-size: 1.25rem; color: var(--forest); }
.mission .copy span { color: var(--ink-soft); font-size: 0.98rem; }
.stars { letter-spacing: 0.08em; color: var(--gold-deep); font-size: 1.05rem; white-space: nowrap; }
.stars .off { color: #c9bfa6; }

.panel {
  background: var(--paper);
  border-radius: 24px;
  padding: 1.15rem 1.15rem 1.3rem;
  box-shadow: var(--shadow);
}
.meta {
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.75rem;
  color: var(--gold-deep);
  margin: 0 0 0.35rem;
}
.gloss {
  background: #e7f0ea;
  border-radius: 14px;
  padding: 0.55rem 0.75rem;
  color: var(--forest-mid);
  font-size: 1rem;
}
.demo {
  margin: 0.8rem 0;
  padding: 0.85rem;
  background: #fff6d8;
  border-radius: 16px;
  font-size: 1.35rem;
  text-align: center;
  font-weight: 800;
}
.eq { color: var(--leaf); }
.sign-list { padding-left: 1.1rem; margin: 0.4rem 0 0; }
.sign-list li { margin: 0.35rem 0; }

.mn { font-family: var(--serif); font-size: 1.45rem; white-space: nowrap; }
.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  line-height: 1.05;
  margin: 0 0.12em;
}
.frac span:first-child {
  border-bottom: 3px solid var(--ink);
  padding: 0 0.2em 0.08em;
}
.frac span:last-child { padding: 0.08em 0.2em 0; }

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
  margin-top: 1rem;
}
.actions.stack, .actions.one { grid-template-columns: 1fr; }
.btn {
  appearance: none;
  min-height: var(--tap);
  border: 0;
  border-radius: 999px;
  background: var(--forest);
  color: var(--gold);
  font: inherit;
  font-weight: 800;
  padding: 0.7rem 1.1rem;
  cursor: pointer;
}
.btn:hover { background: var(--forest-deep); }
.btn:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.ghost {
  background: transparent;
  color: var(--forest);
  border: 3px solid var(--forest);
}
.btn.warn { background: #7a3e12; color: #ffe7c4; }

.prompt { font-size: 1.2rem; }
.prompt .mn { display: inline-block; margin-top: 0.35rem; }

.frac-in {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  align-items: center;
  margin: 0.9rem 0;
}
.sign-tog {
  min-width: var(--tap);
  min-height: var(--tap);
  border-radius: 16px;
  border: 3px solid var(--forest);
  background: #fff;
  font: inherit;
  font-weight: 800;
  font-size: 1.6rem;
  cursor: pointer;
}
.sign-tog.neg { background: var(--warn-bg); }
.stack-in { display: grid; gap: 0.35rem; justify-items: center; }
.stack-in input {
  width: 4.6rem;
  text-align: center;
}
.stack-in .bar {
  width: 4.6rem;
  height: 3px;
  background: var(--ink);
}
input[type="text"], input[type="number"] {
  font: inherit;
  font-size: 1.35rem;
  font-weight: 800;
  padding: 0.65rem 0.55rem;
  border-radius: 14px;
  border: 3px solid #c9bfa6;
  background: #fff;
  min-height: var(--tap);
  max-width: 100%;
}
input:focus { border-color: var(--forest); outline: none; }
.wide { width: min(16rem, 100%); }

.choices, .signs {
  display: grid;
  gap: 0.55rem;
  margin: 0.8rem 0;
}
.signs { grid-template-columns: repeat(4, 1fr); }
.choice, .sign {
  appearance: none;
  min-height: var(--tap);
  border-radius: 16px;
  border: 3px solid #c9bfa6;
  background: #fff;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  padding: 0.7rem;
}
.choice[aria-pressed="true"], .sign[aria-pressed="true"] {
  border-color: var(--forest);
  background: #e7f0ea;
}
.sign { font-size: 1.7rem; font-family: var(--serif); }

.fb {
  min-height: 1.3em;
  margin: 0.7rem 0 0;
  padding: 0.7rem 0.85rem;
  border-radius: 14px;
  font-weight: 800;
}
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.almost { background: var(--almost-bg); color: var(--almost); }
.fb.no { background: var(--warn-bg); color: var(--warn); }
.hint-line {
  margin-top: 0.7rem;
  background: #ece6f5;
  border-radius: 14px;
  padding: 0.7rem 0.85rem;
  font-weight: 700;
}

.steps { padding-left: 1.15rem; margin: 0.4rem 0 0; }
.steps li { margin: 0.45rem 0; }

.win {
  text-align: center;
  padding: 0.4rem 0 0.2rem;
}
.win .burst {
  font-size: 2rem;
  letter-spacing: 0.12em;
  color: var(--gold-deep);
  animation: pop 0.5s ease;
}
.tiny {
  margin-top: 1.6rem;
  text-align: center;
  font-size: 0.85rem;
}
.tiny a { color: var(--leaf); }
.grownup p { color: var(--ink-soft); }

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .mission, .win .burst { animation: none; }
}

@media (max-width: 520px) {
  .coach .face { width: 72px; height: 72px; }
  .signs { grid-template-columns: repeat(2, 1fr); }
  .brand small { display: none; }
}

@media (min-width: 720px) {
  body { font-size: 1.2rem; }
  #stage { padding-top: 1.4rem; }
}
  </style>
</head>
<body>
  <a class="skip" href="#stage">Skip to mission</a>
  <header class="top">
    <a class="brand" href="#home" id="brand-home">
      <svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="45" fill="#0d3b2e"/><circle cx="48" cy="48" r="40" fill="none" stroke="#e8c547" stroke-width="2.4"/><path d="M22 58c6-16 16-26 30-28 4 8 10 14 20 16-8 6-12 16-10 26-10-4-22-4-32-2 2-6 0-10-8-12z" fill="#1a5c45"/><path d="M28 50c8-12 18-18 28-18 2 6 8 11 16 13-8 4-10 12-8 20-8-3-18-3-26-1" fill="#e8c547"/><path d="M40 42c6-2 12 0 14 6" fill="none" stroke="#0d3b2e" stroke-width="2" stroke-linecap="round"/><circle cx="58" cy="44" r="2.2" fill="#0d3b2e"/><path d="M62 38l10-6-2 10" fill="#c9a227"/></svg>
      <span><strong>Dragon Hall</strong><small>Pip’s math missions</small></span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" type="button" id="btn-home" hidden>Home</button>
    </div>
  </header>
  <main id="stage"></main>
  <script src="js/tutor-engine.js"></script>
  <script>
(function () {
  var E = window.DHEngine;
  var stage = document.getElementById("stage");
  var homeBtn = document.getElementById("btn-home");
  var itemCount = 0;
  var state = {
    screen: "home",
    missionId: null,
    teachIndex: 0,
    item: null,
    wrongs: 0,
    hintsShown: 0,
    feedback: null,
    selected: "",
    sign: 1,
    draft: {},
    showModel: false
  };

  if (!E) {
    stage.innerHTML = "<div class='panel'><h1>Pip needs one more file.</h1><p>Keep <code>app.html</code> next to the <code>js</code> folder, then open it again.</p></div>";
    return;
  }

  var progress = E.loadProgress();

  function save() { E.saveProgress(progress); }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function stars(n) {
    var s = "";
    for (var i = 0; i < 5; i++) s += i < n ? "★" : "<span class='off'>★</span>";
    return s;
  }

  function face() {
    return '<svg class="face" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="45" fill="#0d3b2e"/><circle cx="48" cy="48" r="40" fill="none" stroke="#e8c547" stroke-width="2.4"/><path d="M22 58c6-16 16-26 30-28 4 8 10 14 20 16-8 6-12 16-10 26-10-4-22-4-32-2 2-6 0-10-8-12z" fill="#1a5c45"/><path d="M28 50c8-12 18-18 28-18 2 6 8 11 16 13-8 4-10 12-8 20-8-3-18-3-26-1" fill="#e8c547"/><path d="M40 42c6-2 12 0 14 6" fill="none" stroke="#0d3b2e" stroke-width="2" stroke-linecap="round"/><circle cx="58" cy="44" r="2.2" fill="#0d3b2e"/><path d="M62 38l10-6-2 10" fill="#c9a227"/></svg>';
  }

  function coach(text) {
    return '<div class="coach"><div>' + face() + '</div><div class="bubble"><p>' + text + "</p></div></div>";
  }

  function missionMeta(id) {
    return E.MISSIONS.find(function (m) { return m.id === id; });
  }

  function freshItem(id) {
    itemCount += 1;
    return E.makeItem(id, E.makeRng((Date.now() + itemCount * 10007) >>> 0));
  }

  function goHome() {
    state.screen = "home";
    state.missionId = null;
    state.feedback = null;
    state.showModel = false;
    location.hash = "home";
    render();
  }

  function openMission(id) {
    if (!E.isUnlocked(progress, id)) {
      state.screen = "locked";
      state.missionId = id;
      location.hash = id;
      render();
      return;
    }
    state.missionId = id;
    state.teachIndex = 0;
    state.feedback = null;
    state.selected = "";
    state.showModel = false;
    state.wrongs = 0;
    state.hintsShown = 0;
    state.screen = progress.missions[id].taught ? "intro" : "intro";
    location.hash = id;
    render();
  }

  function startTeach() {
    state.screen = "teach";
    state.teachIndex = 0;
    render();
  }

  function startTry() {
    E.markTaught(progress, state.missionId);
    save();
    state.screen = "try";
    state.item = freshItem(state.missionId);
    state.wrongs = 0;
    state.hintsShown = 0;
    state.feedback = null;
    state.selected = "";
    state.showModel = false;
    state.sign = 1;
    state.draft = {};
    render();
  }

  function readAnswer() {
    var item = state.item;
    if (!item) return "";
    if (item.input === "fraction") {
      var sign = state.sign < 0 ? "-" : "";
      var w = (document.getElementById("in-whole") || {}).value || "";
      var n = (document.getElementById("in-num") || {}).value || "";
      var d = (document.getElementById("in-den") || {}).value || "";
      w = String(w).trim();
      n = String(n).trim();
      d = String(d).trim();
      if (w && n && d) return sign + w + " " + n + "/" + d;
      if (n && d) return sign + n + "/" + d;
      if (w && !n && !d) return sign + w;
      return "";
    }
    if (item.input === "power") {
      var b = (document.getElementById("in-base") || {}).value || "";
      var e = (document.getElementById("in-exp") || {}).value || "";
      var plain = (document.getElementById("in-plain") || {}).value || "";
      if (String(plain).trim()) return String(plain).trim();
      if (String(b).trim() && String(e).trim()) return String(b).trim() + "^" + String(e).trim();
      return "";
    }
    if (item.input === "money") {
      return ((document.getElementById("in-money") || {}).value || "").trim();
    }
    return state.selected;
  }

  function snapshotDraft() {
    state.draft = {
      whole: ((document.getElementById("in-whole") || {}).value || ""),
      num: ((document.getElementById("in-num") || {}).value || ""),
      den: ((document.getElementById("in-den") || {}).value || ""),
      base: ((document.getElementById("in-base") || {}).value || ""),
      exp: ((document.getElementById("in-exp") || {}).value || ""),
      plain: ((document.getElementById("in-plain") || {}).value || ""),
      money: ((document.getElementById("in-money") || {}).value || "")
    };
  }

  function fill(id, key) {
    var el = document.getElementById(id);
    if (el && state.draft && state.draft[key] != null) el.value = state.draft[key];
  }

  function restoreDraft() {
    fill("in-whole", "whole");
    fill("in-num", "num");
    fill("in-den", "den");
    fill("in-base", "base");
    fill("in-exp", "exp");
    fill("in-plain", "plain");
    fill("in-money", "money");
  }

  function onCheck() {
    if (!state.item || state.showModel) return;
    snapshotDraft();
    var raw = readAnswer();
    var grade = state.item.grade(raw);
    state.feedback = grade;
    if (grade.result === "correct") {
      E.applyGrade(progress, state.missionId, "correct");
      save();
      state.wrongs = 0;
      if (progress.missions[state.missionId].mastered && progress.missions[state.missionId].streak >= E.MASTERY_STREAK) {
        state.screen = "win";
      }
    } else if (grade.result === "almost" || grade.result === "try") {
      state.wrongs += 1;
      E.applyGrade(progress, state.missionId, grade.result);
      save();
      if (state.wrongs >= E.HINT_AFTER_WRONG) state.showModel = true;
    }
    render();
  }

  function onHint() {
    if (!state.item) return;
    var line = E.hintText(state.item, state.hintsShown);
    if (state.hintsShown < state.item.hints.length) state.hintsShown += 1;
    state.feedback = { result: "hint", message: line };
    render();
  }

  function nextItem() {
    state.item = freshItem(state.missionId);
    state.wrongs = 0;
    state.hintsShown = 0;
    state.feedback = null;
    state.selected = "";
    state.showModel = false;
    state.sign = 1;
    state.draft = {};
    state.screen = "try";
    render();
  }

  function renderHome() {
    var cards = E.MISSIONS.map(function (m, i) {
      var row = progress.missions[m.id];
      var open = E.isUnlocked(progress, m.id);
      var lock = open ? "" : " locked";
      var tag = open ? (row.mastered ? "Replay" : "Start") : "Locked";
      return (
        '<button class="mission' + lock + '" type="button" data-open="' + m.id + '">' +
          '<span class="num">' + (open ? m.icon : "🔒") + "</span>" +
          '<span class="copy"><strong>' + m.title + "</strong><span>" + m.kid + "</span></span>" +
          '<span class="stars" aria-label="' + row.stars + " stars\">" + stars(row.stars) + "<br><small>" + tag + "</small></span>" +
        "</button>"
      );
    }).join("");
    var done = E.MISSIONS.filter(function (m) { return progress.missions[m.id].mastered; }).length;
    stage.innerHTML =
      coach("Hi. I’m Pip. Pick a mission. I’ll help one step at a time.") +
      "<h1>Pick a mission</h1>" +
      '<p class="lede">You can do this by yourself. Big buttons. I’ll check your work.</p>' +
      '<div class="mission-list">' + cards + "</div>" +
      '<p class="tiny"><a href="#grownup">Grown-up</a>' +
      (done ? " · " + done + " of 4 missions done" : "") +
      "</p>";
  }

  function renderLocked() {
    var prev = E.MISSIONS[E.MISSIONS.findIndex(function (m) { return m.id === state.missionId; }) - 1];
    stage.innerHTML =
      coach("This door is still shut.") +
      '<div class="panel"><h1>Not yet</h1><p>Finish <b>' +
      (prev ? prev.title : "the first mission") +
      "</b> first. Then this one opens.</p>" +
      '<div class="actions one"><button class="btn" type="button" data-act="home">Back to missions</button></div></div>';
  }

  function renderIntro() {
    var m = missionMeta(state.missionId);
    var row = progress.missions[state.missionId];
    var extra = row.taught
      ? '<div class="actions"><button class="btn" type="button" data-act="try">Practice</button><button class="btn ghost" type="button" data-act="teach">See the steps</button></div>'
      : '<div class="actions one"><button class="btn" type="button" data-act="teach">Start</button></div>';
    stage.innerHTML =
      coach("One idea at a time. Then you try.") +
      '<div class="panel"><p class="meta">Mission ' + m.icon + " of 4</p><h1>" + m.title + "</h1><p>" + m.kid + "</p>" +
      '<p class="stars">' + stars(row.stars) + "</p>" +
      extra + "</div>";
  }

  function renderTeach() {
    var m = missionMeta(state.missionId);
    var steps = E.TEACH[state.missionId];
    var step = steps[state.teachIndex];
    var last = state.teachIndex === steps.length - 1;
    var back = state.teachIndex > 0
      ? '<button class="btn ghost" type="button" data-act="teach-back">Back</button>'
      : '<button class="btn ghost" type="button" data-act="intro">Back</button>';
    var next = last
      ? '<button class="btn" type="button" data-act="try">I will try it</button>'
      : '<button class="btn" type="button" data-act="teach-next">Next</button>';
    stage.innerHTML =
      coach(step.coach) +
      '<div class="panel"><p class="meta">' + m.title + " · step " + (state.teachIndex + 1) + " of " + steps.length + "</p>" +
      step.body +
      '<div class="actions">' + back + next + "</div></div>";
  }

  function inputHtml(item) {
    if (item.input === "fraction") {
      var neg = state.sign < 0;
      return (
        '<div class="frac-in">' +
          '<button class="sign-tog' + (neg ? " neg" : "") + '" type="button" data-act="flip" aria-label="Sign">' + (neg ? "−" : "+") + "</button>" +
          '<input id="in-whole" type="text" inputmode="numeric" autocomplete="off" aria-label="Whole number" placeholder="whole">' +
          '<div class="stack-in">' +
            '<input id="in-num" type="text" inputmode="numeric" autocomplete="off" aria-label="Top number" placeholder="top">' +
            '<span class="bar"></span>' +
            '<input id="in-den" type="text" inputmode="numeric" autocomplete="off" aria-label="Bottom number" placeholder="bottom">' +
          "</div>" +
        "</div>" +
        "<p class='lede'>A mix, or just a fraction, is fine.</p>"
      );
    }
    if (item.input === "sign") {
      return (
        '<div class="signs" role="group" aria-label="Compare signs">' +
          signBtn("<", "&lt;") + signBtn(">", "&gt;") + signBtn("<=", "≤") + signBtn(">=", "≥") +
        "</div>"
      );
    }
    if (item.input === "choice") {
      return '<div class="choices">' + item.choices.map(function (c) {
        return '<button class="choice" type="button" data-choice="' + escapeHtml(c.value) + '" aria-pressed="' + (state.selected === c.value) + '">' + escapeHtml(c.html) + "</button>";
      }).join("") + "</div>";
    }
    if (item.input === "power") {
      return (
        '<div class="frac-in">' +
          '<input id="in-base" class="wide" type="text" inputmode="numeric" autocomplete="off" aria-label="Base" placeholder="base">' +
          "<span class='mn'>^</span>" +
          '<input id="in-exp" type="text" inputmode="numeric" autocomplete="off" aria-label="Little number" placeholder="n">' +
        "</div>" +
        '<p class="lede">Or type the value.</p>' +
        '<input id="in-plain" class="wide" type="text" inputmode="numeric" autocomplete="off" aria-label="Plain number" placeholder="number">'
      );
    }
    return '<p><input id="in-money" class="wide" type="text" inputmode="decimal" autocomplete="off" aria-label="Dollar amount" placeholder="312"></p>';
  }

  function signBtn(value, label) {
    return '<button class="sign" type="button" data-choice="' + escapeHtml(value) + '" aria-pressed="' + (state.selected === value) + '">' + label + "</button>";
  }

  function renderTry() {
    var m = missionMeta(state.missionId);
    var row = progress.missions[state.missionId];
    var item = state.item;
    var talk = "Your turn. Check when you are ready.";
    var fb = "";
    if (state.feedback) {
      if (state.feedback.result === "correct") talk = "Yes!";
      else if (state.feedback.result === "almost") talk = "So close.";
      else if (state.feedback.result === "hint") talk = "One next step.";
      else if (state.feedback.result === "empty") talk = "I need an answer first.";
      else talk = "Not yet.";
      var kind = state.feedback.result === "correct" ? "ok" : state.feedback.result === "almost" ? "almost" : state.feedback.result === "hint" ? "" : "no";
      if (state.feedback.result !== "hint") {
        fb = '<p class="fb ' + kind + '" role="status">' + state.feedback.message + "</p>";
      }
    }
    var hint = "";
    if (state.hintsShown > 0) {
      hint = '<p class="hint-line" role="status">Hint: ' + E.hintText(item, state.hintsShown - 1) + "</p>";
    }
    var model = "";
    if (state.showModel) {
      model =
        '<div class="panel" style="margin-top:0.8rem;background:#fff6d8">' +
        "<h2>Watch this one</h2>" + item.modelHtml +
        '<div class="actions one"><button class="btn" type="button" data-act="next">New problem</button></div></div>';
      talk = "Two tries. Watch the steps. Then a new one.";
    }
    var nextBtn = state.feedback && state.feedback.result === "correct"
      ? '<button class="btn" type="button" data-act="next">Next one</button>'
      : '<button class="btn ghost" type="button" data-act="hint">Hint</button>';
    stage.innerHTML =
      coach(talk) +
      '<div class="panel">' +
        '<p class="meta">' + m.title + ' · ' + row.streak + " in a row · need " + E.MASTERY_STREAK + "</p>" +
        '<p class="stars">' + stars(Math.max(row.stars, row.streak)) + "</p>" +
        '<p class="prompt">' + item.promptHtml + "</p>" +
        (state.showModel ? "" : inputHtml(item)) +
        fb + hint +
        (state.showModel ? "" : '<div class="actions"><button class="btn" type="button" data-act="check">Check</button>' + nextBtn + "</div>") +
      "</div>" + model;
  }

  function renderWin() {
    var m = missionMeta(state.missionId);
    var nxt = E.nextMissionId(state.missionId);
    var nextM = nxt ? missionMeta(nxt) : null;
    var more = nextM
      ? '<div class="actions"><button class="btn" type="button" data-open="' + nextM.id + '">Go to ' + nextM.title + '</button><button class="btn ghost" type="button" data-act="home">Home</button></div>'
      : '<div class="actions one"><button class="btn" type="button" data-act="home">See all missions</button></div>';
    var line = nextM ? nextM.title + " is open now." : "You finished every mission. You can replay any one.";
    stage.innerHTML =
      coach("You did it!") +
      '<div class="panel win"><p class="burst">★★★★</p><h1>' + m.title + " complete</h1>" +
      "<p>Four right in a row.</p><p>" + line + "</p>" + more + "</div>";
  }

  function renderGrownup() {
    stage.innerHTML =
      coach("This page is for a grown-up. Kids can skip it.") +
      '<div class="panel grownup"><h1>Grown-up</h1>' +
      "<p>A child can run the missions alone. Pip teaches one idea, then checks work. After two misses, a worked model appears and a new twin problem follows.</p>" +
      "<p>Stars save on this device. Paper practice is extra, not required.</p>" +
      '<div class="actions stack">' +
        '<a class="btn" href="print.html">Print practice packet</a>' +
        '<button class="btn warn" type="button" data-act="reset">Reset stars on this device</button>' +
        '<button class="btn ghost" type="button" data-act="home">Back to Pip</button>' +
      "</div>" +
      '<p class="tiny">Pedagogy adapted from <a href="https://github.com/AlexBarba-x/commons">Dragon Hall Commons</a> (CC BY-SA 4.0). Practice items are original. Not copied from any test worksheet.</p>' +
      "</div>";
  }

  function render() {
    homeBtn.hidden = state.screen === "home";
    if (state.screen === "home") renderHome();
    else if (state.screen === "locked") renderLocked();
    else if (state.screen === "intro") renderIntro();
    else if (state.screen === "teach") renderTeach();
    else if (state.screen === "try") renderTry();
    else if (state.screen === "win") renderWin();
    else if (state.screen === "grownup") renderGrownup();
    else renderHome();
    if (state.screen === "try") restoreDraft();
    var first = stage.querySelector("input, button.btn, button.mission");
    if (first && state.screen !== "try") first.focus();
  }

  stage.addEventListener("click", function (event) {
    var t = event.target.closest("[data-open], [data-act], [data-choice]");
    if (!t) return;
    if (t.dataset.open) {
      openMission(t.dataset.open);
      return;
    }
    if (t.dataset.choice != null) {
      state.selected = t.dataset.choice;
      render();
      return;
    }
    var act = t.dataset.act;
    if (act === "home") goHome();
    else if (act === "teach") startTeach();
    else if (act === "intro") { state.screen = "intro"; render(); }
    else if (act === "teach-next") { state.teachIndex += 1; render(); }
    else if (act === "teach-back") { state.teachIndex = Math.max(0, state.teachIndex - 1); render(); }
    else if (act === "try") startTry();
    else if (act === "check") onCheck();
    else if (act === "hint") onHint();
    else if (act === "next") nextItem();
    else if (act === "flip") {
      snapshotDraft();
      state.sign = state.sign < 0 ? 1 : -1;
      render();
    }
    else if (act === "reset") {
      progress = E.emptyProgress();
      save();
      goHome();
    }
  });

  stage.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && state.screen === "try" && !state.showModel) {
      if (event.target && event.target.tagName === "INPUT") {
        event.preventDefault();
        onCheck();
      }
    }
  });

  homeBtn.addEventListener("click", goHome);
  document.getElementById("brand-home").addEventListener("click", function (event) {
    event.preventDefault();
    goHome();
  });

  function fromHash() {
    var id = (location.hash || "#home").replace(/^#/, "") || "home";
    if (id === "grownup") {
      state.screen = "grownup";
      state.missionId = null;
      render();
      return;
    }
    if (E.MISSIONS.some(function (m) { return m.id === id; })) {
      openMission(id);
      return;
    }
    state.screen = "home";
    state.missionId = null;
    render();
  }

  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
  </script>
</body>
</html>
